description: >-
  Negative probe record for AgBiome. AgBiome Inc. wound down over 2023-2024: it filed a
  North Carolina WARN notice in late 2023 covering its entire staff of 123, sold the
  Howler and Theia biofungicides to Certis Biologicals in March 2024, and sold its
  microbial platform assets (115,000+ sequenced strains, 500M+ gene sequences and the
  development pipeline) to Ginkgo Bioworks in April 2024. The company domain agbiome.com
  still resolves (Cloudflare nameservers, Google Workspace MX) but no longer serves the
  company site: it answers from a Nexcess shared-hosting origin (209.126.25.32) whose TLS
  certificate is issued to CN=nxcli.net and does not match the hostname, and every path
  returns either the 3,267-byte Nexcess "coming soon" placeholder (root), a 199-byte
  Apache 403 (every /.well-known/ path) or a 196-byte Apache 404. NOTHING here is a
  document. No WellKnown, SecurityTxt, AgentCard, LLMsTxt or OpenAPI pointer is emitted
  from this probe, and none should ever be emitted from it in a later round.

