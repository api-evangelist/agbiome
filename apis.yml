aid: agbiome
name: AgBiome
description: >-
  AgBiome was an agricultural biotechnology company headquartered in Research Triangle Park,
  Durham, North Carolina. Founded in 2012 by Scott Uknes, Eric Ward, Jeff Dangl, John Ryals and
  Paul Schulze-Lefert, it built the proprietary GENESIS discovery platform — a collection of more
  than 100,000 fully sequenced, isolated plant-associated microbial strains and hundreds of
  millions of gene sequences, screened with high-throughput assays for insect, disease and
  nematode control — and turned it into crop-protection biologicals. It commercialized the
  Howler and Theia biofungicides and had a third, Esendo, before the EPA, and it spun out the
  genome-editing venture LifeEDIT Therapeutics in October 2020 (acquired by ElevateBio in
  October 2021). Backed by Syngenta, Novozymes, Monsanto, ARCH Venture Partners, Polaris, the
  Bill & Melinda Gates Foundation, Pontifax and UTIMCO, the company nonetheless failed to raise
  further capital: it filed a North Carolina WARN notice in late 2023 covering its entire staff
  of 123, sold Howler and Theia to Certis Biologicals (a Mitsui & Co. subsidiary) in March 2024,
  and sold its platform assets to Ginkgo Bioworks in April 2024 for roughly $18.2 million in
  stock. AgBiome never published a developer program, public API, SDK, or machine-readable
  specification, and agbiome.com no longer serves the company site — it answers from a Nexcess
  shared-hosting placeholder under a certificate issued to CN=nxcli.net. This profile is
  retained as a historical record; there is no API surface to enrich.
